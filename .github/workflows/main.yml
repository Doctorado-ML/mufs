name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          black --check --diff mufs
          flake8 --count mufs
      - name: Tests & coverage
        run: |
          mkdir .report
          coverage run -m xmlrunner -v mufs.tests -o .report
          coverage xml -i -o .report/coverage.xml
          coverage report -m --fail-under=100
      - name: Upload coverage to Codacy
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        continue-on-error: true
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: Doctorado-ML
          CODACY_PROJECT_NAME: mufs
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) \
            report -r .report/coverage.xml
      - name: Get project version
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: echo "project_version=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
      - name: Override Coverage Source Path for Sonar
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: sed -i 's/\/home\/runner\/work\/mufs\/mufs\//\/github\/workspace\//g' .report/coverage.xml
